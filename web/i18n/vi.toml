title = "GPU Goblin — cho khoa học mượn sức mạnh máy tính của bạn"
description = "GPU Goblin cho phép bất kỳ ai cho nghiên cứu khoa học mượn card đồ họa của máy tính mình, và giúp các nhà nghiên cứu sử dụng một mạng lưới tính toán lớn để thúc đẩy tri thức: tính toán ma trận lớn, huấn luyện mô hình và nhiều hơn nữa. Miễn phí cho nghiên cứu, kết quả được kiểm chứng, bạn luôn nắm quyền kiểm soát."

