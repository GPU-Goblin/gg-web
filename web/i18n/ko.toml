title = "GPU Goblin — 내 컴퓨터의 힘을 과학에"
description = "GPU Goblin은 누구나 컴퓨터의 그래픽카드를 과학 연구에 빌려주고, 연구자는 대규모 컴퓨팅 네트워크를 활용해 지식을 발전시킬 수 있게 합니다(대규모 행렬 계산, 모델 학습 등). 연구용 무료, 검증된 결과, 모든 제어는 사용자에게."

