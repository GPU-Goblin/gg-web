dl_verify_win = "Cada versão publicada virá com uma lista de somas de verificação (`SHA256SUMS`) **assinada com a chave de publicação**; o instalador verifica essa assinatura com `ssh-keygen` antes de rodar qualquer coisa, e depois confere cada arquivo com a lista. No Windows, o aplicativo faz as mesmas verificações por conta própria, com a chave que carrega, antes de instalar qualquer coisa; os comandos abaixo são para Linux."
