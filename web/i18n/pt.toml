title = "GPU Goblin — empreste a potência do seu computador à ciência"
description = "O GPU Goblin permite que qualquer pessoa empreste a placa de vídeo do seu computador à pesquisa científica, e que pesquisadores usem uma grande rede de computação para fazer o conhecimento avançar: grandes cálculos matriciais, treinamento de modelos e mais. Gratuito para pesquisa, resultados verificados, você mantém o controle."

