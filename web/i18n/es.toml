# Interface texts of the site in Spanish (same keys as en.toml).
title = "GPU Goblin — presta la potencia de tu ordenador a la ciencia"
description = "GPU Goblin permite a cualquiera prestar la tarjeta gráfica de su ordenador a la investigación científica, y a los investigadores usar una gran red de cálculo para hacer avanzar el conocimiento: grandes cálculos matriciales, entrenamiento de modelos y más. Gratuito para la investigación, resultados verificados, tú mantienes el control."

