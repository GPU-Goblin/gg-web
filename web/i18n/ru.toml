title = "GPU Goblin — предоставьте мощность своего компьютера науке"
description = "GPU Goblin позволяет каждому предоставить видеокарту своего компьютера для научных исследований, а исследователям — использовать большую вычислительную сеть, чтобы двигать знание вперёд: большие матричные вычисления, обучение моделей и многое другое. Бесплатно для науки, результаты проверяются, всё под вашим контролем."

