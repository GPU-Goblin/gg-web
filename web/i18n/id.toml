title = "GPU Goblin — pinjamkan daya komputer Anda untuk sains"
description = "GPU Goblin memungkinkan siapa pun meminjamkan kartu grafis komputernya untuk riset ilmiah, dan memungkinkan peneliti menggunakan jaringan komputasi yang besar untuk memajukan ilmu pengetahuan: komputasi matriks besar, pelatihan model, dan lainnya. Gratis untuk riset, hasil terverifikasi, Anda tetap memegang kendali."

