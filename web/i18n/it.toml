dl_verify_now = "Ogni versione pubblicata è accompagnata da un elenco di checksum (`SHA256SUMS`) **firmato con la chiave di rilascio**; il programma di installazione verifica quella firma con `ssh-keygen` prima di eseguire qualsiasi cosa, poi controlla ogni file rispetto all'elenco."
