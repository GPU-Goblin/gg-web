# Interface texts of the site in Italian (same keys as en.toml).
title = "GPU Goblin — presta la potenza del tuo computer alla scienza"
description = "GPU Goblin permette a chiunque di prestare la scheda grafica del proprio computer alla ricerca scientifica, e ai ricercatori di usare una grande rete di calcolo per far avanzare la conoscenza: grandi calcoli matriciali, addestramento di modelli e altro. Gratuito per la ricerca, risultati verificati, il controllo resta a te."

