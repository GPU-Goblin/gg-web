dl_verify_now = "Jede veröffentlichte Version wird mit einer Liste von Prüfsummen (`SHA256SUMS`) ausgeliefert, die **mit dem Release-Schlüssel signiert** ist; das Installationsprogramm prüft diese Signatur mit `ssh-keygen`, bevor es irgendetwas ausführt, und prüft dann jede Datei anhand der Liste."
dl_verify_win = "Jede veröffentlichte Version wird mit einer Liste von Prüfsummen (`SHA256SUMS`) ausgeliefert, die **mit dem Release-Schlüssel signiert** ist; das Installationsprogramm prüft diese Signatur mit `ssh-keygen`, bevor es irgendetwas ausführt, und prüft dann jede Datei anhand der Liste. Unter Windows prüft die Anwendung dasselbe selbst, mit dem Schlüssel, den sie mitbringt, bevor sie irgendetwas installiert; die Befehle unten sind für Linux."
