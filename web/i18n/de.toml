# Interface texts of the site in German (same keys as en.toml).
title = "GPU Goblin — leih der Wissenschaft die Rechenleistung deines Computers"
description = "Mit GPU Goblin kann jede und jeder die Grafikkarte des eigenen Computers der wissenschaftlichen Forschung leihen, und Forschende können ein großes Rechennetz nutzen, um das Wissen voranzubringen: große Matrixberechnungen, das Training von Modellen und mehr. Kostenlos für die Forschung, geprüfte Ergebnisse, du behältst die Kontrolle."

