# Textes d'interface du site en français (mêmes clés que en.toml).
title = "GPU Goblin — prêtez la puissance de votre ordinateur à la science"
description = "GPU Goblin permet à chacun de prêter la carte graphique de son ordinateur à la recherche scientifique, et aux chercheurs d'utiliser un grand réseau de calcul pour faire avancer la connaissance : grands calculs matriciels, entraînement de modèles et plus encore. Gratuit pour la recherche, résultats vérifiés, vous gardez la main."

