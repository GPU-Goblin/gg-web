# Interface texts of the site in Bengali (translated from en.toml, which is the reference).
title = "GPU Goblin — আপনার কম্পিউটারের শক্তি বিজ্ঞানকে ধার দিন"
description = "GPU Goblin-এর মাধ্যমে যে কেউ তাঁর কম্পিউটারের গ্রাফিক্স কার্ড বৈজ্ঞানিক গবেষণায় ধার দিতে পারেন, আর গবেষকেরা জ্ঞানকে এগিয়ে নিতে একটি বড় কম্পিউটিং নেটওয়ার্ক ব্যবহার করতে পারেন: বড় ম্যাট্রিক্স গণনা, মডেল প্রশিক্ষণ এবং আরও অনেক কিছু। গবেষণার জন্য বিনামূল্যে, যাচাই করা ফলাফল, নিয়ন্ত্রণ আপনার হাতে।"

