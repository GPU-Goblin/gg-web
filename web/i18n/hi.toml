title = "GPU Goblin — अपने कंप्यूटर की शक्ति विज्ञान को उधार दें"
description = "GPU Goblin की मदद से कोई भी अपने कंप्यूटर का ग्राफ़िक्स कार्ड वैज्ञानिक शोध को उधार दे सकता है, और शोधकर्ता ज्ञान को आगे बढ़ाने के लिए एक बड़े कंप्यूटिंग नेटवर्क का उपयोग कर सकते हैं: बड़ी मैट्रिक्स गणनाएँ, मॉडल प्रशिक्षण और भी बहुत कुछ। शोध के लिए मुफ़्त, सत्यापित परिणाम, नियंत्रण आपके हाथ में।"

